<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <!-- example for getElementById() -->
    <h1 id="my-heading">heading</h1>



    <!-- example for getElementsByClassName() -->
    <h1> Food R Us </h1>

    <div class="fruits">Apple</div>
    <div class="fruits">Banana</div>
    <div class="fruits">Cherry</div>
    <div class="fruits">Date</div>
    <div class="fruits">Elderberry</div>


    <!-- example for getElementsByTagName() -->

    <h4>Root vegetables</h4>

    <ul>
        <li>Carrot</li>
        <li>Beetroot</li>
        <li>Radish</li>
    </ul>

    <h4>Non-Root vegetables</h4>

    <ul>
        <li>Celery</li>
        <li>Broccoli</li>
        <li>Spinach</li>
    </ul>


    <script src="52_element_selectors.js"></script>
</body>

</html>
